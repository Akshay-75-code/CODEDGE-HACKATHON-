<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduCollab Pro | Neon Workspace</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { 
            --bg: #050505; 
            --glass: rgba(255, 255, 255, 0.03);
            --sidebar-glass: rgba(10, 10, 15, 0.7);
            --accent: #00f2ff; 
            --text: #e0e0e0; 
            --border: rgba(255, 255, 255, 0.1); 
            --v-control: #bd00ff; 
            --chat-accent: #ff00c8;
            --role-bg: rgba(0, 242, 255, 0.1);
            --warning: #ff3e3e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        
        body { background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }

        #bgCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: radial-gradient(circle at center, #111 0%, #000 100%); }

        #connOverlay { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(15px); background: rgba(0,0,0,0.6); }

        .conn-box { 
            background: var(--sidebar-glass); padding: 40px; border-radius: 24px; border: 1px solid var(--accent); width: 420px; text-align: center;
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.2);
        }

        .sidebar { width: 280px; background: var(--sidebar-glass); backdrop-filter: blur(10px); border-right: 1px solid var(--border); display: flex; flex-direction: column; }

        .sidebar-section { padding: 20px; border-top: 1px solid var(--border); }
        .section-title { font-size: 11px; font-weight: 800; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 15px; }

        .user-tag { 
            background: var(--glass); padding: 12px; border-radius: 12px; margin-bottom: 8px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 4px;
        }
        .role-chip { font-size: 9px; color: var(--accent); text-transform: uppercase; font-weight: bold; background: var(--role-bg); padding: 2px 6px; border-radius: 4px; width: fit-content; }
        .status-line { display: flex; align-items: center; gap: 8px; font-size: 13px; }
        .status-dot { width: 7px; height: 7px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 8px var(--accent); }

        .editor-space { flex-grow: 1; display: flex; flex-direction: column; background: rgba(0,0,0,0.3); }
        .toolbar { height: 65px; background: var(--sidebar-glass); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 25px; justify-content: space-between; }
        
        .deadline-bar { background: rgba(255, 0, 200, 0.05); padding: 8px 25px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 15px; }
        #deadlineClock { font-family: 'Courier New', Courier, monospace; font-weight: bold; color: var(--chat-accent); text-shadow: 0 0 10px var(--chat-accent); font-size: 14px; }
        .deadline-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #888; }

        textarea { width: 100%; height: 100%; background: transparent; color: #79c0ff; border: none; padding: 30px; font-family: 'Fira Code', monospace; font-size: 16px; outline: none; resize: none; line-height: 1.6; caret-color: var(--accent); }

        .chat-area { width: 320px; background: var(--sidebar-glass); backdrop-filter: blur(10px); border-left: 1px solid var(--border); display: flex; flex-direction: column; }
        .chat-header { padding: 20px; background: rgba(255,255,255,0.03); border-bottom: 1px solid var(--border); }
        #chatBox { flex-grow: 1; overflow-y: auto; padding: 20px; }
        .msg { margin-bottom: 12px; padding: 10px; background: var(--glass); border-radius: 10px; border-right: 3px solid var(--chat-accent); font-size: 13px; }

        .btn { border: none; border-radius: 8px; padding: 10px 18px; cursor: pointer; font-weight: 700; font-size: 11px; transition: 0.3s; color: white; text-transform: uppercase; }
        .btn-prime { background: var(--accent); color: #000; box-shadow: 0 0 15px rgba(0, 242, 255, 0.4); }
        .input-field { background: rgba(0,0,0,0.5); border: 1px solid var(--border); color: white; padding: 12px; border-radius: 10px; width: 100%; margin: 8px 0; outline: none; }
        
        .dt-picker { background: #111; border: 1px solid var(--border); color: var(--accent); padding: 5px; border-radius: 4px; font-size: 11px; outline: none; }

        .version-item { background: var(--glass); border: 1px solid var(--border); padding: 10px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid var(--v-control); cursor: pointer; font-size: 12px; transition: 0.2s; }
        .version-item:hover { background: rgba(255,255,255,0.08); }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <div id="connOverlay">
        <div class="conn-box">
            <h1 style="color: var(--accent); margin-bottom: 5px;">EduCollab <span style="color:white">PRO</span></h1>
            <p style="font-size: 11px; color: #888; margin-bottom: 20px;">SYNC GATEWAY v2.3</p>
            <input type="text" id="userNameInput" class="input-field" placeholder="User Alias">
            <select id="userRoleInput" class="input-field">
                <option value="Frontend">Role: Frontend Developer</option>
                <option value="Backend">Role: Backend Developer</option>
                <option value="Fullstack">Role: Fullstack Engineer</option>
                <option value="DevOps">Role: DevOps / System</option>
                <option value="UI/UX">Role: Designer</option>
            </select>
            <div id="setupActions">
                <button class="btn btn-prime" style="width: 100%;" onclick="startSession()">Initialize Room</button>
                <div style="margin: 15px; color: #555; font-size: 10px;">OR JOIN SESSION</div>
                <input type="text" id="joinIdInput" class="input-field" placeholder="Target Room ID">
                <button class="btn" style="background: #222; width: 100%;" onclick="joinSession()">Connect to Stream</button>
            </div>
            <div id="loadingStatus" style="display: none; color: var(--accent); margin-top: 15px;">Establishing Peer Link...</div>
        </div>
    </div>

    <aside class="sidebar">
        <div style="padding: 25px;">
            <div class="section-title">Peer Hash</div>
            <div id="displayID" style="color: var(--accent); font-family: monospace; cursor: pointer; font-size: 13px;" onclick="copyID()">Generating...</div>
        </div>
        <div class="sidebar-section">
            <div class="section-title">Team Composition</div>
            <div id="userList"></div>
        </div>
        <div class="sidebar-section" style="flex-grow: 1; overflow-y: auto;">
            <div class="section-title">Timeline Snapshots</div>
            <div id="versionHistory"></div>
        </div>
    </aside>

    <main class="editor-space">
        <div class="toolbar">
            <div id="roomStatus" style="font-size: 11px; font-weight: bold; color: var(--accent);">STATUS: CONNECTED</div>
            <div style="display: flex; gap: 12px; align-items: center;">
                <span class="deadline-label">Goal:</span>
                <input type="datetime-local" id="deadlinePicker" class="dt-picker" onchange="updateDeadline(this.value)">
                <button class="btn" style="background: rgba(255,255,255,0.1);" onclick="document.getElementById('fileInput').click()">📂 Import</button>
                <input type="file" id="fileInput" onchange="importLocalFile(event)" style="display:none">
                <button class="btn" style="background: var(--v-control);" onclick="createSnapshot()">📸 Snap</button>
                <button class="btn btn-prime" onclick="exportCode()">💾 Export</button>
            </div>
        </div>
        
        <div class="deadline-bar">
            <span class="deadline-label">Project Countdown:</span>
            <div id="deadlineClock">--:--:--:--</div>
        </div>

        <textarea id="mainEditor" spellcheck="false" placeholder="// Neural link active. Start coding..."></textarea>
    </main>

    <section class="chat-area">
        <div class="chat-header">
            <div class="section-title" style="margin-bottom: 0;">Team Chat Board</div>
        </div>
        <div id="chatBox"></div>
        <div style="padding: 15px; background: rgba(0,0,0,0.3);">
            <input type="text" id="chatInput" class="input-field" placeholder="Send data packet...">
        </div>
    </section>

    <script>
        /* --- BACKGROUND SCRIPT --- */
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function initBg() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            for(let i=0; i<80; i++) particles.push({x: Math.random()*canvas.width, y: Math.random()*canvas.height, vx: (Math.random()-0.5)*0.5, vy: (Math.random()-0.5)*0.5});
        }
        function drawBg() {
            ctx.clearRect(0,0,canvas.width, canvas.height); ctx.fillStyle = "rgba(0, 242, 255, 0.4)";
            particles.forEach(p => { p.x += p.vx; p.y += p.vy; if(p.x<0 || p.x>canvas.width) p.vx *= -1; if(p.y<0 || p.y>canvas.height) p.vy *= -1; ctx.beginPath(); ctx.arc(p.x, p.y, 1.2, 0, Math.PI*2); ctx.fill(); });
            requestAnimationFrame(drawBg);
        }
        initBg(); drawBg();

        /* --- PEER LOGIC --- */
        let peer, myName, myRole, versionCount = 0;
        let connections = {};
        let targetDeadline = null;
        const editor = document.getElementById('mainEditor');

        function initPeer() {
            myName = document.getElementById('userNameInput').value || "Agent";
            myRole = document.getElementById('userRoleInput').value;
            document.getElementById('setupActions').style.display = 'none';
            document.getElementById('loadingStatus').style.display = 'block';
            
            peer = new Peer(); 
            peer.on('open', (id) => {
                document.getElementById('connOverlay').style.display = 'none';
                document.getElementById('displayID').innerText = id;
                renderUserList();
            });
            peer.on('connection', (conn) => handleConnection(conn));
        }

        function handleConnection(conn) {
            conn.on('open', () => {
                const meta = conn.metadata || { name: "Peer", role: "Developer" };
                connections[conn.peer] = { conn, name: meta.name, role: meta.role };
                renderUserList();
                addChatMessage("SYSTEM", `${meta.name} [${meta.role}] linked.`);
                conn.send({ type: 'SYNC_ALL', data: editor.value, deadline: targetDeadline });
            });
            conn.on('data', (data) => {
                if (data.type === 'SYNC') editor.value = data.data;
                if (data.type === 'SYNC_ALL') { editor.value = data.data; targetDeadline = data.deadline; }
                if (data.type === 'CHAT') addChatMessage(data.user, data.data);
                if (data.type === 'SNAPSHOT') createSnapshot(data);
                if (data.type === 'DEADLINE_SYNC') targetDeadline = data.deadline;
            });
            conn.on('close', () => { delete connections[conn.peer]; renderUserList(); });
        }

        /* --- DEADLINE & SNAPSHOT LOGIC --- */
        function updateDeadline(val) {
            targetDeadline = new Date(val).getTime();
            broadcast({ type: 'DEADLINE_SYNC', deadline: targetDeadline });
            addChatMessage("SYSTEM", `Deadline updated by ${myName}`);
        }

        function createSnapshot(remoteData = null) {
            const code = remoteData ? remoteData.code : editor.value;
            const author = remoteData ? remoteData.user : "Local";
            const timestamp = new Date().toLocaleTimeString();
            versionCount++;
            const history = document.getElementById('versionHistory');
            const item = document.createElement('div');
            item.className = 'version-item';
            item.innerHTML = `<span style="font-size:10px; color:#888">${timestamp}</span><br><b>v${versionCount}</b> by ${author}`;
            item.onclick = () => { 
                if(confirm(`Restore v${versionCount}?`)) { 
                    editor.value = code; 
                    broadcast({ type: 'SYNC', data: code }); 
                } 
            };
            history.prepend(item);
            if (!remoteData) broadcast({ type: 'SNAPSHOT', code: code, user: myName });
        }

        setInterval(() => {
            const clock = document.getElementById('deadlineClock');
            if (!targetDeadline) { clock.innerText = "NO DEADLINE SET"; return; }
            const now = new Date().getTime();
            const diff = targetDeadline - now;
            if (diff <= 0) {
                clock.innerText = "DEADLINE EXPIRED";
                clock.style.color = "var(--warning)";
                return;
            }
            clock.style.color = "var(--chat-accent)";
            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((diff % (1000 * 60)) / 1000);
            clock.innerText = `T-MINUS ${d}d ${h}h ${m}m ${s}s`;
        }, 1000);

        /* --- UI HELPERS --- */
        function startSession() { initPeer(); }
        function joinSession() {
            const id = document.getElementById('joinIdInput').value;
            if(!id) return alert("Target ID required");
            initPeer();
            peer.on('open', () => handleConnection(peer.connect(id, { metadata: { name: myName, role: myRole } })));
        }

        function broadcast(payload) { for (let id in connections) connections[id].conn.send(payload); }

        function importLocalFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                editor.value = e.target.result;
                broadcast({ type: 'SYNC', data: editor.value });
                addChatMessage("SYSTEM", `File imported: ${file.name}`);
            };
            reader.readAsText(file);
        }

        function renderUserList() {
            const list = document.getElementById('userList');
            list.innerHTML = `<div class="user-tag"><div class="role-chip">${myRole}</div><div class="status-line"><div class="status-dot"></div><b>${myName}</b> (You)</div></div>`;
            for (let id in connections) {
                list.innerHTML += `<div class="user-tag"><div class="role-chip" style="color:#aaa; border: 1px solid #444; background:none;">${connections[id].role}</div><div class="status-line"><div class="status-dot"></div>${connections[id].name}</div></div>`;
            }
        }

        function addChatMessage(u, t) {
            const b = document.getElementById('chatBox');
            b.innerHTML += `<div class="msg"><b>${u}:</b> ${t}</div>`;
            b.scrollTop = b.scrollHeight;
        }

        editor.addEventListener('input', () => broadcast({ type: 'SYNC', data: editor.value }));
        document.getElementById('chatInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && e.target.value !== "") {
                addChatMessage("Me", e.target.value);
                broadcast({ type: 'CHAT', user: myName, data: e.target.value });
                e.target.value = "";
            }
        });

        function copyID() { navigator.clipboard.writeText(document.getElementById('displayID').innerText); alert("ID Copied!"); }
        function exportCode() { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([editor.value], {type: 'text/plain'})); a.download = "collab_export.txt"; a.click(); }
    </script>
</body>
</html>
